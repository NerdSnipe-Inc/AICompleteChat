name: AICompleteChat
options:
  bundleIdPrefix: com.nerdsnipe
  deploymentTarget:
    macOS: "15.0"
packages:
  # DesignFoundationPro is the one package that stays local-path — it's a private, licensed
  # package (github.com/NerdSnipe-Inc/DesignFoundationPro), and that's the intentional gate: this
  # repo is meant to be read and learned from by anyone, but only actually builds for someone who
  # has DesignFoundationPro access. Every other dependency below is public, so pinning them to a
  # real GitHub release lets SwiftPM resolve them automatically for anyone — no manual clone into
  # a matching local directory layout required, unlike a path-based reference.
  DesignFoundationPro:
    path: /Users/nerdsnipe/Projects/DesignFoundationPro
  DesignFoundation:
    url: https://github.com/NerdSnipe-Inc/design-foundation.git
    from: 1.3.3
  AIChatKit:
    url: https://github.com/NerdSnipe-Inc/AIChatKit.git
    from: 1.0.3
  AIChatKitMLX:
    url: https://github.com/NerdSnipe-Inc/AIChatKitMLX.git
    from: 1.1.2
  AiPersona:
    url: https://github.com/NerdSnipe-Inc/AiPersona.git
    from: 1.0.3
  AiVoiceKit:
    # Not `from:` — AiVoiceKit's own manifest pins FluidAudio/DynamicNotchKit to exact git
    # revisions (their tagged releases were missing APIs this code needs), and SwiftPM refuses to
    # resolve a "stable" semver requirement on a package whose own dependencies are revision-pinned
    # ("unstable"). Branch tracking is the correct reference for a package with that shape.
    url: https://github.com/NerdSnipe-Inc/AiVoiceKit.git
    branch: master
targets:
  AICompleteChat:
    type: application
    platform: macOS
    sources:
      - AICompleteChat
      - Appicon.icon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nerdsnipe.aicompletechat
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: QW2MDLZZJH
        "CODE_SIGN_IDENTITY[sdk=macosx*]": "Apple Development"
        ASSETCATALOG_COMPILER_APPICON_NAME: Appicon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: AICompleteChat/AICompleteChat.entitlements
    info:
      path: AICompleteChat/Info.plist
      properties:
        CFBundleDisplayName: AICompleteChat
        LSMinimumSystemVersion: "15.0"
        NSMicrophoneUsageDescription: "AICompleteChat uses your microphone for voice dictation and voice commands."
        NSSpeechRecognitionUsageDescription: "AICompleteChat uses on-device speech recognition to turn your voice into text."
    dependencies:
      - package: DesignFoundation
      - package: DesignFoundationPro
      - package: AIChatKit
        product: AIChatCore
      - package: AIChatKit
        product: AIChatUI
      - package: AIChatKitMLX
        product: AIChatMLX
      - package: AiPersona
      - package: AiVoiceKit
  AICompleteChatTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - AICompleteChatTests
    settings:
      base:
        SWIFT_VERSION: "6.0"
    dependencies:
      - target: AICompleteChat
