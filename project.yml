name: AICompleteChat
options:
  bundleIdPrefix: com.nerdsnipe
  deploymentTarget:
    macOS: "15.0"
packages:
  DesignFoundation:
    # Must match the path DesignFoundationPro's own Package.swift uses (../design-foundation,
    # the canonical repo name) — SwiftPM derives package "identity" from the reference path text,
    # not the resolved real directory, so pointing here at /Projects/DesignFoundation (capitalized,
    # this machine's actual directory name) while DesignFoundationPro's manifest points at
    # /Projects/design-foundation (lowercase-hyphenated, via a local symlink to the same directory)
    # makes SwiftPM see two different package identities for the same product and fail to resolve.
    path: /Users/nerdsnipe/Projects/design-foundation
  DesignFoundationPro:
    path: /Users/nerdsnipe/Projects/DesignFoundationPro
  AIChatKit:
    path: /Users/nerdsnipe/xCodeProjects/NerdSnipe-Inc-Packages/AIChatKit
  AIChatKitMLX:
    path: /Users/nerdsnipe/xCodeProjects/NerdSnipe-Inc-Packages/AIChatKitMLX
  AiPersona:
    path: /Users/nerdsnipe/xCodeProjects/NerdSnipe-Inc-Packages/AiPersona
  AiVoiceKit:
    path: /Users/nerdsnipe/xCodeProjects/NerdSnipe-Inc-Packages/AiVoiceKit
targets:
  AICompleteChat:
    type: application
    platform: macOS
    sources:
      - AICompleteChat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nerdsnipe.aicompletechat
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: QW2MDLZZJH
        "CODE_SIGN_IDENTITY[sdk=macosx*]": "Apple Development"
    info:
      path: AICompleteChat/Info.plist
      properties:
        CFBundleDisplayName: AICompleteChat
        LSMinimumSystemVersion: "15.0"
        NSMicrophoneUsageDescription: "AICompleteChat uses your microphone for voice dictation and voice commands."
        NSSpeechRecognitionUsageDescription: "AICompleteChat uses on-device speech recognition to turn your voice into text."
    dependencies:
      - package: DesignFoundation
      - package: DesignFoundationPro
      - package: AIChatKit
        product: AIChatCore
      - package: AIChatKit
        product: AIChatUI
      - package: AIChatKitMLX
        product: AIChatMLX
      - package: AiPersona
      - package: AiVoiceKit
  AICompleteChatTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - AICompleteChatTests
    settings:
      base:
        SWIFT_VERSION: "6.0"
    dependencies:
      - target: AICompleteChat
